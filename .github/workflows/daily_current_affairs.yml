name: Daily Current Affairs Automation

on:
  schedule:
    # Staggered cron retry windows in Indian Standard Time (UTC + 5:30)
    # Allows GitHub Actions multiple opportunities to trigger around morning delivery window
    - cron: '45 1 * * *'  # 07:15 AM IST
    - cron: '0 2 * * *'   # 07:30 AM IST
    - cron: '15 2 * * *'  # 07:45 AM IST
    - cron: '30 2 * * *'  # 08:00 AM IST
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even if already posted today'
        required: false
        default: 'false'
        type: boolean
  repository_dispatch:
    types: [daily_trigger]

concurrency:
  group: daily-current-affairs-post
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Hindi Fonts & Verify Browser
        run: |
          echo "Checking preinstalled browsers..."
          which google-chrome || which chromium || which chromium-browser || (sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser || true)
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-lohit-deva || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Bilingual Current Affairs Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID != '' && secrets.TELEGRAM_CHAT_ID || '@sscstudyprephub' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRANSLATOR_EMAIL: ${{ secrets.TRANSLATOR_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          FORCE_RUN: ${{ inputs.force || 'false' }}
        run: |
          python -u main.py

      - name: Upload PDF Artifact (Backup archive in GitHub)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-current-affairs-pdf
          path: SSC_Current_Affairs_*.pdf
          retention-days: 7
