name: Daily Current Affairs Automation

on:
  schedule:
    # Off-peak UTC minute (02:03 UTC = 07:33 AM IST) to avoid :00/:30 queue delays and land before/around 8:00 AM IST
    - cron: '3 2 * * *'
  workflow_dispatch:

concurrency:
  group: daily-current-affairs-post
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Hindi Fonts & Verify Browser
        run: |
          echo "Checking preinstalled browsers..."
          which google-chrome || which chromium || which chromium-browser || (sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser || true)
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-lohit-deva || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Bilingual Current Affairs Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID != '' && secrets.TELEGRAM_CHAT_ID || '@sscstudyprephub' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python -u main.py

      - name: Upload PDF Artifact (Backup archive in GitHub)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-current-affairs-pdf
          path: SSC_Current_Affairs_*.pdf
          retention-days: 7
